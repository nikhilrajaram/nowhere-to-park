name: Data Pipeline

# recomputes parking.pmtiles from US OSM geofabrik archives (https://www.geofabrik.de/)
# runs monthly
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

# avoid overlapping runs
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build PMTiles and upload to R2
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # US OSM archive ~12 GB; reclaim space defensively
        uses: jlumbroso/free-disk-space@main
        with:
          docker-images: false

      - name: Build pipeline image
        run: docker build -t ntp-pipeline ./data-pipeline

      - name: Run container
        run: |
          mkdir -p "${RUNNER_TEMP}/data"
          docker run --rm -v "${RUNNER_TEMP}/data:/data" ntp-pipeline
          ls -lh "${RUNNER_TEMP}/data/parking.pmtiles"

      - name: Upload artifacts
        # uploads to Cloudflare R2 via its S3-compatible API
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # R2 rejects the integrity checksums aws-cli >=2.23 sends by default
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET_NAME: nowhere-to-park
        run: |
          set -euo pipefail
          DEST="s3://${R2_BUCKET_NAME}/parking.pmtiles"
          if aws s3 ls "$DEST" >/dev/null 2>&1; then
            STAMP="$(date -u +%Y-%m-%d)"
            aws s3 cp "$DEST" "s3://${R2_BUCKET_NAME}/archive/parking-${STAMP}.pmtiles"
          fi
          aws s3 cp "${RUNNER_TEMP}/data/parking.pmtiles" "$DEST"
